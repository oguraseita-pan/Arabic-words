/* WordMate: detailed dictionary and audio-first learning controls. */
.logo-app-icon{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:0 0 auto}
.mobile-brand .logo-app-icon{width:38px;height:38px;border-radius:11px}
.subtle-tag{background:var(--mint);color:var(--green)}
.detail-link{border:0;background:none;color:var(--green);font-size:12px;font-weight:800;padding:7px 0;text-align:left;display:block}
.detail-link:hover{text-decoration:underline}
.example-button{border:0;width:100%;text-align:left;cursor:pointer;font-size:12px}
.example-button:hover,.flash-example:hover,.result-example:hover,.sense-example:hover{background:var(--mint)}
.flash-term{background:transparent;border:0;color:var(--text);font-size:clamp(25px,3.3vw,42px);font-weight:800;line-height:1.35;letter-spacing:-.02em;overflow-wrap:anywhere;cursor:pointer}
.flash-term span{font-size:16px;vertical-align:middle;color:var(--green)}
.flash-answer-term{display:flex;flex-wrap:wrap;gap:7px 14px;align-items:center;justify-content:center}
.flash-answer-term strong{font-size:clamp(15px,2vw,22px)}
.flash-answer-word{border:0;background:none;color:var(--green);font-size:clamp(16px,2.2vw,25px);font-weight:850;line-height:1.4}
.flash-example{width:100%;border:0;border-radius:12px;background:var(--soft);padding:13px 15px;text-align:center;font-size:13px;font-weight:650;margin:13px 0}
.flash-answer .detail-link{text-align:center;width:100%;margin-top:8px}
.clickable-question{display:block;width:100%;padding:6px;border:0;background:none;color:var(--text);cursor:pointer;font-weight:800}
.result-word{border:0;background:none;padding:6px 0;color:var(--green);font-size:17px;font-weight:850;text-align:left}
.result-example{display:block;width:100%;text-align:left;border:0;background:var(--soft);padding:10px 11px;border-radius:9px;margin:6px 0;font-size:12px}
.detail-modal{max-width:710px;padding:27px 30px;box-shadow:0 22px 70px #0004}
.detail-modal .modal-head{padding-bottom:9px;border-bottom:1px solid var(--border)}
.detail-title{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:20px 0 8px}
.detail-title h2{font-size:clamp(26px,4vw,38px);line-height:1.28;letter-spacing:-.03em;overflow-wrap:anywhere;margin:0}
.detail-title .audio-btn{font-size:12px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px}
.detail-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.detail-intro{font-weight:750;font-size:16px;margin:14px 0 18px}
.detail-section-heading{font-size:15px;margin:21px 0 11px}
.detail-section-heading small{color:var(--muted);font-weight:600;font-size:12px}
.sense-card{padding:16px 17px;border:1px solid var(--border);background:var(--surface);border-radius:14px;margin:11px 0}
.sense-head{display:flex;gap:10px;align-items:center;font-size:14px}
.sense-number{display:inline-grid;place-items:center;flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:var(--green);background:var(--mint);font-size:12px;font-weight:850}
.sense-example{display:block;width:100%;border:0;background:var(--soft);text-align:left;padding:11px 13px;border-radius:10px;font-weight:700;margin:12px 0 5px;line-height:1.65}
.listen-glyph{color:var(--green);margin-right:4px}
.example-ja{color:var(--muted);font-size:12px;margin:7px 0}
.sense-explain{font-size:12px;margin:8px 0 0;color:var(--text);line-height:1.6}
.detail-usage{background:var(--soft);padding:14px 17px;border-radius:13px;margin:13px 0}
.detail-usage h3{margin:0 0 8px;font-size:13px}
.detail-usage p{font-size:12px;margin:0;color:var(--text);white-space:pre-wrap}
.related-tags{display:flex;flex-wrap:wrap;gap:7px}.related-tags span{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:12px}
.detail-foot{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;padding-top:19px;margin-top:12px;border-top:1px solid var(--border)}
@media(max-width:700px){
 .detail-modal{max-height:92dvh;padding:18px 16px;border-radius:17px}
 .detail-title h2{font-size:clamp(23px,6vw,32px)}
 .sense-card{padding:13px}.sense-example{padding:10px}
 .flash-term{font-size:clamp(23px,6vw,34px)}
 .word-card .detail-link{padding-top:8px}
}


/* WordMate: phone navigation, memory review controls */
.mobile-settings-link{display:none}
.home-shortcuts{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
.srs-panel{grid-column:1/-1}
.srs-panel p,.srs-panel .setting-row small{color:var(--muted);font-size:12px;line-height:1.6}
.srs-panel .setting-row small{display:block;margin-top:4px;font-size:11px}
.srs-panel .setting-row select{width:148px;max-width:45%;flex-shrink:0}
.srs-preview{border-radius:13px;padding:15px;margin-top:13px;background:var(--mint)}
.srs-preview>strong{display:block;margin-bottom:12px;font-size:13px}
.srs-preview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.srs-preview-grid>div{background:var(--surface);border-radius:9px;padding:9px 5px;display:flex;align-items:center;flex-direction:column;gap:5px}
.srs-preview-grid small{font-size:11px;color:var(--muted)}
.srs-preview-grid strong{font-size:14px;color:var(--green)}
.srs-note{font-size:11px!important;background:var(--soft);padding:13px;border-radius:11px;margin-top:12px!important}
.grade-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.grade-btn small{font-size:10px;white-space:nowrap;font-weight:700}
.next-review-note{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;border-radius:10px;background:var(--mint);margin:12px 0;font-size:12px}
.next-review-note strong{color:var(--green);font-size:13px}
@media(max-width:1100px){
 .mobile-settings-link{display:grid;place-items:center;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;width:42px;height:42px;font-size:21px}
}
@media(max-width:700px){
 .srs-preview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .srs-panel .setting-row{align-items:flex-start;gap:9px}
 .srs-panel .setting-row select{max-width:48%;min-width:0;font-size:12px}
 .settings-panel{padding:18px 15px}
 .home-shortcuts .btn{flex:1;min-width:145px}
 .grade-btn{min-height:54px}
}
